<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry to Plate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f2;--sf:#fff;--ink:#18211e;--mut:#66736d;--ln:#e2e8e4;--ac:#2b6a59;--acs:#e1eee8;--on:#fff;--am:#b97d12;--ams:#f8ecd3;--rd:#c25547;--rds:#f7e0dc;--bl:#4f86b0;--glass:rgba(255,255,255,.74);--sh:0 10px 32px rgba(24,33,30,.09);--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--sf:#17201b;--ink:#e7eee9;--mut:#8fa097;--ln:#25312a;--ac:#6ec4a5;--acs:#1d3128;--on:#0e1411;--am:#e3b153;--ams:#33290f;--rd:#e08a7d;--rds:#3a1f1b;--bl:#8db8dc;--glass:rgba(23,32,27,.72);--sh:0 10px 32px rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .45s var(--spring),box-shadow .25s,background .25s,opacity .25s}
.press:active{transform:scale(.94);transition-duration:.08s}
@media(hover:hover){.press:hover{opacity:.92}}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:10px}
button:disabled{opacity:.45;pointer-events:none}

.head{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 18px) 22px 12px;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(var(--bg) 70%,transparent)}
.head h1{margin:0;font-size:34px;line-height:1.05}
.head p{margin:4px 0 0;color:var(--mut);font-size:14px}
.roundbtn{width:46px;height:46px;border-radius:50%;background:var(--sf);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ac)}
main{padding:6px 18px calc(150px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.hero{background:var(--acs);border-radius:26px;padding:22px;margin-bottom:22px}
.hero b{display:block;font:500 28px/1.15 Fraunces,Georgia,serif}
.hero span{color:var(--mut);font-size:15px}
.grp{margin:22px 6px 8px;font-size:14px;font-weight:600;color:var(--mut)}
.list{background:var(--sf);border-radius:22px;box-shadow:var(--sh);padding:4px 14px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row.in,.card.in{animation:rise .6s var(--ease) both;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .t{stroke:var(--ln)}.ring .p{stroke:var(--ac);transition:stroke-dasharray .8s var(--ease)}
.ring.am .p{stroke:var(--am)}.ring.rd .p{stroke:var(--rd)}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font:600 14px Figtree;font-style:normal}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span{font-size:14px;color:var(--mut)}
.row.am .txt span{color:var(--am);font-weight:600}.row.rd .txt span{color:var(--rd);font-weight:600}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.x svg{width:20px;height:20px}

.card{background:var(--sf);border-radius:22px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:21px}
.card .m{color:var(--mut);font-size:14px;margin-bottom:12px}
.flag{display:inline-block;background:var(--ams);color:var(--am);font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:4px 12px;border-radius:99px;font-size:14px;background:var(--acs);color:var(--ac);font-weight:500}
.chip.no{background:none;color:var(--mut);box-shadow:inset 0 0 0 1px var(--ln)}

.empty{text-align:center;padding:36px 18px}
.empty .art{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--sf) 38%,var(--acs) 39%,var(--acs) 60%,transparent 61%);color:var(--ac);animation:float 5s ease-in-out infinite}
.empty .art svg{width:38px;height:38px}
@keyframes float{50%{transform:translateY(-6px)}}
.empty h2{margin:0 0 6px;font-size:26px}
.empty p{margin:0 auto 20px;color:var(--mut);max-width:260px}
.btn{background:var(--ac);color:var(--on);font-weight:600;border-radius:16px;padding:14px 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.ghost{background:var(--acs);color:var(--ac)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:10;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:34px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--sh),inset 0 0 0 1px var(--ln)}
.tab{position:relative;width:72px;height:56px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);transition:color .3s,background .3s,transform .45s var(--spring)}
.tab.on{color:var(--ac);background:var(--acs)}
.fab{position:relative;width:72px;height:72px;border-radius:50%;margin:-22px 6px;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:0 12px 26px color-mix(in srgb,var(--ac) 45%,transparent)}
.fab svg{width:30px;height:30px}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:breathe 3.2s ease-out infinite}
@keyframes breathe{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}

.back{position:fixed;inset:0;z-index:20;background:rgba(8,12,10,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sf);border-radius:30px 30px 0 0;padding:12px 22px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .55s var(--spring);max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 18px}
.sheet h2{margin:0 0 16px;font-size:26px}
.sheet input{width:100%;font:inherit;font-size:17px;color:var(--ink);padding:15px 16px;margin-bottom:10px;border:0;border-radius:16px;background:var(--bg);box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .25s}
.sheet input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--ac)}
.sheet .btn{width:100%;margin-top:6px}
#fmsg{min-height:20px;color:var(--rd);font-size:14px;margin:2px 4px 4px}
.tick{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tick path{stroke-dasharray:30;stroke-dashoffset:30}
.draw path{animation:draw .5s .05s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.scan{position:fixed;inset:0;z-index:30;background:#090e0c;color:#eaf3ee;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .45s var(--ease),transform .6s var(--ease)}
.scan.open{opacity:1;pointer-events:auto;transform:none}
.scan .close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.stage{position:relative;width:min(88vw,400px);border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);transform:scale(.92);transition:transform .8s var(--spring)}
.scan.open .stage{transform:none}
.stage img{display:block;width:100%;max-height:50vh;object-fit:cover;transition:filter 1s}
.go img{filter:brightness(.62) saturate(.85)}
.sweep,.grid,.br{opacity:0;transition:opacity .6s}
.go .sweep,.go .grid,.go .br{opacity:1}
.sweep{position:absolute;left:0;right:0;height:42%;top:-42%;background:linear-gradient(transparent,rgba(120,235,185,.3));border-bottom:2px solid rgba(170,255,220,.95);box-shadow:0 6px 24px rgba(120,235,185,.6);animation:sw 2.2s ease-in-out infinite}
@keyframes sw{to{top:100%}}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(150,255,210,.14) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(150,255,210,.14) 1px,transparent 1px) 0 0/30px 30px;animation:gp 2.4s ease-in-out infinite}
@keyframes gp{50%{opacity:.35}}
.br i{position:absolute;width:26px;height:26px;border:3px solid #aaf3d6;animation:gp 2.4s ease-in-out infinite}
.br i:nth-child(1){top:12px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.br i:nth-child(2){top:12px;right:12px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.br i:nth-child(3){bottom:12px;left:12px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.br i:nth-child(4){bottom:12px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:10px}
#stat{margin:26px 0 14px;font:500 24px Fraunces,Georgia,serif;text-align:center;min-height:32px;transition:opacity .3s,transform .4s var(--ease)}
#stat.sw{opacity:0;transform:translateY(8px)}
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px;min-height:76px}
.found span{padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);font-weight:500;text-transform:capitalize;animation:pop .55s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(8px)}}
.done{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 40px);width:64px;height:64px;border-radius:50%;background:#7fdcb8;color:#06231a;display:grid;place-items:center;transform:scale(0);transition:transform .6s var(--spring)}
.done.show{transform:scale(1)}
.done .tick{width:32px;height:32px}

.btn.wide{width:100%;margin-bottom:18px}
.lvs{display:flex;gap:8px;margin:0 0 14px;overflow:auto;padding:2px}
.lvs .pk{white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:4px}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--sf);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:transform .5s var(--spring)}
.seg.a::before{transform:translateX(100%)}
.seg button{position:relative;padding:11px 8px;font-weight:600;color:var(--mut);transition:color .3s}
.seg button.on{color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px;max-height:34vh;overflow:auto}
.pk{padding:10px 16px;border-radius:99px;background:var(--bg);font-weight:500;text-transform:capitalize;box-shadow:inset 0 0 0 1px var(--ln);transition:transform .45s var(--spring),background .3s,color .3s}
.pk:active{transform:scale(.93)}
.pk.on{background:var(--ac);color:var(--on);box-shadow:none}
#pickA{margin:18px 0 8px}
.mut{color:var(--mut);margin:0}
#rmsg{min-height:20px;color:var(--rd);font-size:14px;margin:2px 4px 4px}
#rsheet{max-height:88vh;overflow:auto}
.gh{display:flex;justify-content:space-between;align-items:center}
.lnk{color:var(--ac);font-weight:600;padding:6px 8px}
.sk{height:130px;border-radius:22px;margin-bottom:14px;background:linear-gradient(90deg,var(--sf) 30%,var(--acs) 50%,var(--sf) 70%) 0 0/300% 100%;animation:shim 1.5s linear infinite}
@keyframes shim{to{background-position:-300% 0}}
.card details{margin-top:14px}
.card summary{cursor:pointer;font-weight:600;color:var(--ac);list-style:none}
.card summary::-webkit-details-marker{display:none}
.card ol{margin:10px 0 0;padding-left:20px}
.card li{margin-bottom:6px}

.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input{margin:0;flex:1}
.addrow .btn{width:auto;margin:0;padding:0 22px;min-height:0}
#chosen{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;align-items:center;margin-bottom:4px}
.sub{font-size:14px;font-weight:600;color:var(--mut);margin:16px 4px 0}
.lo{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;background:var(--bg);margin-bottom:10px;transition:transform .45s var(--spring),background .3s}
.lo b{display:block;font-weight:600}
.lo small{color:var(--mut);font-size:14px}
.lo.on{background:var(--acs)}
.lo .tick{color:var(--ac)}
.lvl{display:inline-flex;align-items:center;gap:2px;background:var(--acs);color:var(--ac);font-weight:600;font-size:14px;padding:8px 8px 8px 14px;border-radius:99px}
.lvl svg{width:18px;height:18px}

.addfab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 102px);z-index:9;display:inline-flex;align-items:center;gap:6px;height:54px;padding:0 22px 0 16px;border-radius:27px;background:var(--ac);color:var(--on);font-weight:600;box-shadow:0 12px 26px color-mix(in srgb,var(--ac) 40%,transparent)}
.addfab[hidden]{display:none}
.scan.nophoto .stage{display:none}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 8px;padding:4px 18px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mo{flex:none;align-self:center;font-size:13px;font-weight:700;color:var(--mut);padding:0 4px}
.day{flex:none;position:relative;width:50px;height:66px;border-radius:17px;background:var(--sf);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day small{font-size:12px;font-weight:600;color:var(--mut)}
.day b{font-weight:600;font-size:18px}
.day.on{background:var(--ac);color:var(--on)}
.day.on small{color:inherit;opacity:.8}
.day.has::after{content:"";position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.day.on.has::after{background:var(--on)}
.day:disabled{opacity:.35;pointer-events:none}
.sum b{display:block;font:500 40px/1.05 Fraunces,Georgia,serif}
.sum span{color:var(--mut);font-size:15px}
.mac{display:grid;grid-template-columns:64px 1fr 52px;align-items:center;gap:10px;margin:12px 0 0;font-size:14px}
.mac .tr{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}
.mac i{display:block;height:100%;border-radius:4px;transition:width .9s var(--ease)}
.mac em{font-style:normal;text-align:right;font-weight:600}
.minor{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.minor span{background:var(--bg);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mut)}
.meal{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--ln)}
.meal:first-child{border-top:0}
.meal .tx{flex:1;min-width:0}
.meal .t{font-size:13px;color:var(--mut)}
.meal b{display:block;font-weight:600}
.meal .m2{font-size:13px;color:var(--mut)}
.meal .k{font:500 20px Fraunces,Georgia,serif;text-align:right}
.meal .k small{display:block;font:400 12px Figtree,sans-serif;color:var(--mut)}
.hist{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 0;border-top:1px solid var(--ln)}
.hist:first-child{border-top:0}
.hist span{color:var(--mut);font-size:14px}
.bdg{position:absolute;top:2px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rd);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--spring)}
.bdg.on{transform:scale(1)}
.burst{position:absolute;left:50%;top:17px;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--ac);opacity:0;pointer-events:none}
.burst.go{animation:burst .65s var(--ease)}
@keyframes burst{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.fly{position:fixed;z-index:60;pointer-events:none}
.flyc{position:absolute;white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--ac);color:var(--on);font-weight:600;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.mchip{cursor:pointer;padding:7px 14px;transition:background .25s,color .25s,transform .4s var(--spring)}
.mchip:active{transform:scale(.94)}
.mchip.sel{background:var(--ac);color:var(--on);box-shadow:none}
.mchip.onl{background:var(--acs);color:var(--ac);box-shadow:none;pointer-events:none}
.mchip.onl::before{content:"\2713  "}
.cp{padding:16px}.cp h3{font-size:19px}.cp .m{margin-bottom:6px}
.need{margin-top:8px}.need .chips{margin-bottom:10px}
.nl{font-size:13px;color:var(--mut);margin-bottom:8px}
.addall{width:100%;min-height:42px;padding:10px 16px;border-radius:14px;font-size:15px}
.row.open{cursor:pointer}
.qb{font-size:13px;font-weight:600;color:var(--mut);background:var(--bg);padding:3px 10px;border-radius:99px;white-space:nowrap}
#isheet{max-height:90vh;overflow:auto}
.brand{color:var(--mut);margin:-8px 0 12px;font-weight:500}
.ipill{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acs);color:var(--ac);border-radius:16px;padding:12px 16px;font-weight:600;margin-bottom:12px}
.ipill.am{background:var(--ams);color:var(--am)}.ipill.rd{background:var(--rds);color:var(--rd)}
.ipill small{font-size:14px;font-weight:500;opacity:.85}
.qrow{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;font-weight:600}
.step{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:4px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--sf);font-size:22px;font-weight:600;color:var(--ac);box-shadow:var(--sh)}
.step b{min-width:78px;text-align:center}
.sheet label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin:6px 4px}
.sheet select{width:100%;font:inherit;font-size:17px;color:var(--ink);padding:15px 16px;margin-bottom:10px;border:0;border-radius:16px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:6px}
.acts .btn{margin:0!important;width:auto!important}
.nutc{background:var(--bg);box-shadow:none;margin:0 0 8px}
main .addrow input{width:100%;font:inherit;font-size:17px;color:var(--ink);padding:15px 16px;border:0;border-radius:16px;background:var(--sf);box-shadow:var(--sh)}
main .addrow input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--ac)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.srow:first-child{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ln);display:grid;place-items:center;color:var(--on);flex:none;transition:background .3s,box-shadow .3s}
.srow.dn .chk{background:var(--ac);box-shadow:none}
.chk .tick{width:16px;height:16px;stroke-width:3.5}
.srow .nm{flex:1;min-width:0;text-transform:capitalize}
.srow.dn .nm{text-decoration:line-through;color:var(--mut)}
.mchip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid transparent}
.mchip.hv{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:none}
.mchip.hv::before{content:"\2713";font-weight:700}
.mchip.no{background:transparent;color:var(--ink);border:1.5px dashed var(--mut);box-shadow:none}
.mchip.sel{background:var(--am);border:1.5px solid var(--am);color:#fff}
.mchip.sel::before{content:"+";font-weight:700}

<script>
const CPX=new Set(["Spaghetti bolognese","Meatballs","Stuffed peppers","Chicken curry","Chickpea curry","Banana bread","Apple crumble","Chicken noodle soup"]);
const MED=new Set(["Chili","Shakshuka","Baked salmon and potatoes","Shrimp pasta","Creamy mushroom pasta","Lentil soup","Pork chops with apples","Fish tacos","Chicken fried rice","Shrimp fried rice","Chicken stir fry","Tofu stir fry","Veggie stir fry","Pancakes","French toast","Tomato soup","Potato soup","Pumpkin soup","Vegetable soup","Chicken tacos","Beef tacos","Sausage pasta","Sausage and peppers","Mac and cheese","Zucchini fritters","Sweet potato bake"]);
const recipes=`Scrambled eggs on toast|egg,bread,butter
Veggie omelette|egg,cheese,pepper,onion
Cheese omelette|egg,cheese,butter
Mushroom omelette|egg,mushroom,cheese

Avocado toast|avocado,bread,egg

Garlic bread|bread,garlic,butter
BLT sandwich|bacon,lettuce,tomato,bread

Quesadillas|tortilla,cheese,chicken

Chicken fried rice|chicken,rice,egg,onion
Shrimp fried rice|shrimp,rice,egg,onion

Spaghetti aglio e olio|pasta,garlic,oil
Mac and cheese|pasta,cheese,milk,butter
Tuna pasta|tuna,pasta,onion
Pesto pasta|pasta,basil,parmesan,garlic
Creamy mushroom pasta|pasta,mushroom,cream,garlic
Shrimp pasta|shrimp,pasta,garlic,lemon
Sausage pasta|sausage,pasta,tomato
Spaghetti bolognese|beef,pasta,tomato,onion,garlic
Meatballs|beef,egg,bread,onion
Chili|beef,beans,tomato,onion
Stuffed peppers|pepper,rice,beef,cheese
Sausage and peppers|sausage,pepper,onion
Pork chops with apples|pork,apple,onion
Chicken stir fry|chicken,pepper,onion,rice
Chicken curry|chicken,onion,tomato,rice
Chickpea curry|chickpea,tomato,onion,rice
Tofu stir fry|tofu,broccoli,pepper,rice
Veggie stir fry|broccoli,carrot,pepper,rice
Cabbage stir fry|cabbage,carrot,onion
Salmon with rice|salmon,rice,lemon
Baked salmon and potatoes|salmon,potato,lemon
Fish tacos|fish,tortilla,lime,cabbage
Lentil soup|lentil,carrot,onion,garlic
Tomato soup|tomato,onion,garlic,butter
Vegetable soup|carrot,potato,onion,celery
Chicken noodle soup|chicken,carrot,celery,onion,pasta
Potato soup|potato,onion,milk,butter
Pumpkin soup|pumpkin,onion,garlic
Mashed potatoes|potato,butter,milk
Roasted potatoes|potato,oil,garlic
Baked potato|potato,butter,cheese
Hash browns|potato,onion,butter
Sweet potato bake|sweet potato,butter,cinnamon
Roasted vegetables|carrot,potato,onion,oil
Steamed broccoli with cheese|broccoli,cheese,butter
Zucchini fritters|zucchini,egg,flour
Caprese salad|tomato,mozzarella,basil
Greek salad|cucumber,tomato,feta,onion
Garden salad|lettuce,tomato,cucumber,carrot
Caesar salad|lettuce,chicken,parmesan,bread
Coleslaw|cabbage,carrot,mayo
Cucumber yogurt salad|cucumber,yogurt,garlic
Hummus and veggies|chickpea,carrot,cucumber
Guacamole|avocado,onion,tomato,lime
Fruit salad|apple,banana,orange,grape
Banana smoothie|banana,milk,yogurt
Berry smoothie|strawberry,banana,yogurt,milk
Yogurt parfait|yogurt,granola,berry
Apple crumble|apple,flour,butter,sugar`.split("\n").map(l=>{let[n,g]=l.split("|");return{name:n,ingredients:g.split(","),level:CPX.has(n)?"complex":MED.has(n)?"medium":"simple"}});
let pantry=JSON.parse(localStorage.getItem("pantry"))||[],stagger=true;
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
/* If the AI is busy, quietly try once more before showing an error */
const rawFetch=window.fetch.bind(window);
window.fetch=async function(u,o){
  if(!String(u).startsWith("/api/"))return rawFetch(u,o);
  let r;
  try{r=await rawFetch(u,o)}catch(e){await wait(1500);return rawFetch(u,o)}
  if(r.status===503||r.status===502||r.status===429){await wait(2500);try{return await rawFetch(u,o)}catch(e){return r}}
  return r;
};
async function post(u,o){
  let r;
  for(let i=0;i<2;i++){
    r=await fetch(u,o);
    if(r.status!==503&&r.status!==429||i===1)return r;
    await wait(1500);
  }
  return r;
}
const save=()=>localStorage.setItem("pantry",JSON.stringify(pantry));
const sortP=()=>pantry.sort((a,b)=>a.expires.localeCompare(b.expires));
const safe=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const buzz=n=>navigator.vibrate&&navigator.vibrate(n||8);
document.addEventListener("pointerdown",e=>{if(e.target.closest(".press"))buzz(6)});
function daysLeft(s){let t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+"T00:00:00")-t)/864e5)}
function dateIn(n){let d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

let curTab="P";
function setTab(t){
  curTab=t;
  ["P","R","S","L"].forEach(k=>{$("v"+k).hidden=k!==t;$("t"+k).classList.toggle("on",k===t)});
  $("ttl").textContent={P:"Pantry",R:"Recipes",S:"Shopping",L:"Food log"}[t];
  $("addfab").hidden=t==="R"||t==="S";
  scrollTo({top:0});if(t==="R")autoGen();if(t==="L")renderLog();if(t==="S")renderShop();
}
function removeItem(i){pantry.splice(i,1);save();stagger=false;refresh()}

function empty(h,p,btns){return "<div class='empty'><div class='art'><svg class='i'><use href='#cam'/></svg></div><h2 class='serif'>"+h+"</h2><p>"+p+"</p>"+btns+"</div>"}
const emptyBtns="<div style='display:grid;gap:10px;justify-items:center'><button class='btn press' onclick='pick()'><svg class='i'><use href='#cam'/></svg>Scan a photo</button><button class='btn ghost press' onclick='openSheet()'>Add by hand</button></div>";

function row(it,i,k){
  let d=daysLeft(it.expires),c="",m,pct,lab=d;
  if(d<0){c="rd";m="Expired "+dur(-d)+" ago";pct=1;lab="!"}
  else if(d===0){c="am";m="Use today";pct=.04}
  else{m=dur(d)+" left";pct=Math.min(1,d/10);if(d<=3)c="am"}
  if(d>99)lab=Math.round(d/30)+"mo";
  let len=(pct*94.2).toFixed(1);
  return "<div class='row open "+c+(stagger?" in":"")+"' data-id='"+it.id+"' style='--d:"+k*50+"ms'><div class='ring "+c+"'><svg viewBox='0 0 36 36'><circle class='t' cx='18' cy='18' r='15'/><circle class='p' cx='18' cy='18' r='15' stroke-dasharray='"+len+" 94.2'/></svg><em>"+lab+"</em></div><div class='txt'><b>"+safe(it.name)+"</b><span>"+m+(it.brand?" · "+safe(it.brand):"")+"</span></div>"+qb(it)+"<button class='x press' onclick='removeItem("+i+")' aria-label='Remove "+safe(it.name)+"'><svg class='i'><use href='#x'/></svg></button></div>"
}

function showPantry(){
  let box=$("vP");
  if(!pantry.length){box.innerHTML=empty("Your pantry is empty","Scan a photo of your fridge or shelf and it fills itself in.",emptyBtns);return}
  let G=[["Use soon",[]],["Fresh",[]],["Expired",[]]];
  pantry.forEach((it,i)=>{let d=daysLeft(it.expires);G[d<0?2:d<=3?0:1][1].push([it,i])});
  let n=G[0][1].length,x=G[2][1].length,h1,h2;
  if(n){h1=n+(n===1?" item":" items")+" to use soon";h2="Cook with "+(n===1?"this":"these")+" first."}
  else{h1="Everything is fresh";h2="Nothing needs rushing."}
  if(x)h2+=" "+x+(x===1?" item has":" items have")+" expired.";
  let html="<div class='hero'><b>"+h1+"</b><span>"+h2+"</span></div>",k=0;
  for(let g of G){if(!g[1].length)continue;
    html+="<div class='grp'>"+g[0]+"</div><div class='list'>"+g[1].map(p=>row(p[0],p[1],k++)).join("")+"</div>"}
  box.innerHTML=html;
}

const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const wd=(h,n)=>new RegExp("(^|[^\\p{L}])"+esc(n)+"(s|es)?($|[^\\p{L}])","u").test(h);
function match(n,g){let a=n.toLowerCase().trim();return a.length>=3&&(wd(g,a)||wd(a,g))}
const STAPLE=/\b(salt|water|oil|black pepper)\b/i;
const getSC=()=>{try{return JSON.parse(localStorage.getItem("scache"))||{}}catch(e){return{}}};
let RL=[],rnote="",loadingAI=false;
const cmp=(a,b)=>b.ex-a.ex||b.p-a.p;
const LVN={any:"Any level",simple:"Simple",medium:"Medium",complex:"Complex"};
const lvHead=()=>"<div class='grp gh'><span>Recipes for your pantry</span><button class='lvl press' onclick='openL()'>"+LVN[lv]+"<svg class='i'><use href='#chev'/></svg></button></div>";
function norm(name,ings,x){
  let usable=pantry.filter(i=>daysLeft(i.expires)>=0),have=[],miss=[],ex=0,real=0,list=[];
  for(let g of ings){
    let t=String(g).toLowerCase(),f=usable.find(i=>match(i.name,t));
    if(f){have.push(g);list.push({g:g,ok:1});if(!STAPLE.test(t)){real++;if(daysLeft(f.expires)<=3)ex++}}
    else{miss.push(g);list.push({g:g,ok:0})}
  }
  return Object.assign({name:name,ings:ings,have:have,miss:miss,list:list,ex:ex,real:real,p:ings.length?have.length/ings.length:0},x||{});
}
function cardHTML(r,i,lazy,anim){
  let steps="<ol>"+(r.steps||[]).map(t=>"<li>"+safe(t)+"</li>").join("")+"</ol>";
  return "<div class='card cp"+(anim?" in":"")+"' style='--d:"+Math.min(i,10)*60+"ms'>"+(r.ex?"<div class='flag'>Uses food that expires soon</div>":"")+"<h3 class='serif'>"+safe(r.name)+"</h3><div class='m'>You have "+r.have.length+" of "+r.ings.length+" ingredients</div>"+needHTML(r.list)+"<details"+(lazy?" data-k='"+i+"'":"")+"><summary>Show steps</summary>"+steps+"</details></div>";
}
function showRecipes(){
  let box=$("rl"),uc=pantry.filter(i=>daysLeft(i.expires)>=0).length,mn=uc>1?2:1;
  let pre=recipes.filter(r=>lv==="any"||r.level===lv).map(r=>norm(r.name,r.ingredients)).filter(r=>r.real>=mn).sort(cmp).slice(0,15);
  let ai=gAll.map(x=>norm(x.name,x.ingredients||[],{steps:x.steps})).filter(r=>r.real>=1),seen={};
  RL=pre.concat(ai).sort(cmp).filter(r=>{let k=r.name.toLowerCase();if(seen[k])return false;seen[k]=1;return true});
  if(!RL.length&&!loadingAI){box.innerHTML=pantry.length?lvHead()+empty("No matches yet","Add a few more ingredients and recipes will appear here.",""):empty("Nothing to cook yet","Add a few ingredients and recipe ideas will appear here.",emptyBtns);return}
  let sc=getSC();
  RL.forEach(r=>{if(!r.steps&&sc[r.name])r.steps=sc[r.name].steps});
  box.innerHTML=(pantry.length?lvHead():"")+RL.map((r,i)=>cardHTML(r,i,!r.steps,stagger)).join("")+(loadingAI?"<div class='sk'></div><div class='sk'></div>":"")+(uc&&!loadingAI?"<button class='btn ghost press wide' onclick='fetchAI(true)'>Show more recipes</button>":"")+(rnote?"<p class='mut' style='text-align:center'>"+safe(rnote)+"</p>":"");syncCards();
}
$("rl").addEventListener("toggle",async e=>{
  let d=e.target;if(!d.open||d.dataset.k===undefined||d.dataset.done)return;
  let r=RL[+d.dataset.k],ol=d.querySelector("ol");if(!r)return;
  d.dataset.done=1;ol.innerHTML="<li class='mut'>Getting the steps...</li>";
  try{
    let res=await post("/api/recipe",{method:"POST",body:JSON.stringify({recipe:r.name,ingredients:r.ings})});
    let x=await res.json().catch(()=>({}));
    if(!res.ok||!x.steps)throw 0;
    r.steps=x.steps;let c=getSC();c[r.name]={steps:x.steps};try{localStorage.setItem("scache",JSON.stringify(c))}catch(_){}
    ol.innerHTML=x.steps.map(t=>"<li>"+safe(t)+"</li>").join("");
  }catch(_){ol.innerHTML="<li>Steps aren't available right now. Close this and try again in a minute.</li>";delete d.dataset.done}
},true);
function refresh(){showPantry();showRecipes();stagger=false}

/* add by hand */
function openSheet(){$("fmsg").textContent="";$("sheet").classList.add("open");$("back").classList.add("open")}
function closeSheet(){$("sheet").classList.remove("open");$("rsheet").classList.remove("open");$("lsheet").classList.remove("open");$("asheet").classList.remove("open");$("dsheet").classList.remove("open");$("isheet").classList.remove("open");$("back").classList.remove("open");document.activeElement.blur()}
async function addItem(){
  let n=$("iname").value.trim(),d=$("idate").value;
  if(!n||!d){$("fmsg").textContent="Enter what it is and its expiry date.";buzz([12,40,12]);return}
  pantry.push({id:uid(),name:n,brand:"",expires:d,qty:Math.max(0,+$("iqty").value||1),unit:$("iunit").value});sortP();save();
  let b=$("addBtn");b.disabled=true;
  $("addTxt").outerHTML="<svg class='tick draw' id='addTxt' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>";buzz([10,30,10]);
  await wait(750);closeSheet();stagger=true;refresh();setTab("P");
  await wait(500);
  $("iname").value="";$("idate").value="";$("iqty").value=1;b.disabled=false;$("addTxt").outerHTML="<span id='addTxt'>Add to pantry</span>";
}

/* scan */
function pick(){$("photo").click()}
function shrink(file){return new Promise((ok,bad)=>{
  let img=new Image();
  img.onload=()=>{let s=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7).split(",")[1])};
  img.onerror=()=>bad(new Error("That image couldn't be read. Try another photo."));
  img.src=URL.createObjectURL(file);
})}
async function say(t){let s=$("stat");s.classList.add("sw");await wait(280);s.textContent=t;s.classList.remove("sw")}
function closeScan(){$("scan").classList.remove("open");$("stage").classList.remove("go");$("done").classList.remove("show")}

$("photo").addEventListener("change",async()=>{
  let f=$("photo").files[0];if(!f)return;
  $("found").innerHTML="";$("stat").textContent="Looking closely...";$("done").classList.remove("show");
  $("shot").src=URL.createObjectURL(f);$("scan").classList.add("open");buzz(15);
  await wait(500);$("stage").classList.add("go");
  let steps=["Identifying...","Checking freshness..."],si=0,tm=setInterval(()=>{if(si<steps.length)say(steps[si++])},1700);
  try{
    let b64=await shrink(f);
    let r=await post("/api/scan",{method:"POST",body:JSON.stringify({image:b64,mimeType:"image/jpeg"})});
    let d=await r.json();clearInterval(tm);

  let fresh=[],els=[];
  names.forEach((n,i)=>{n=String(n).trim();if(!n)return;
    let ex=shop.find(s=>s.name.toLowerCase()===n.toLowerCase());
    if(ex){if(!ex.done)return;ex.done=false}else shop.push({id:uid(),name:n.slice(0,60),done:false});
    fresh.push(n);els.push(srcs&&srcs[i])});
  saveShop();syncCards();if(curTab==="S")renderShop();
  fresh.forEach((n,i)=>{wait(i*90).then(()=>flyTo(els[i],n)).then(()=>{updBadge(true);react()})});
}
const needHTML=l=>l.length?"<div class='need'><div class='nl'>Green = in your pantry. Outlined = not in your pantry. Tap any to add it to your list.</div><div class='chips'>"+l.map(o=>"<button class='chip mchip "+(o.ok?"hv":"no")+(onList(o.g)?" onl":"")+"' data-n='"+attr(o.g)+"'>"+safe(o.g)+"</button>").join("")+"</div><button class='btn ghost press addall'>Add all missing</button></div>":"";
function syncCards(){
  document.querySelectorAll(".card .mchip").forEach(c=>c.classList.toggle("onl",onList(c.dataset.n)));
  document.querySelectorAll(".card .need").forEach(nd=>{
    let all=[...nd.querySelectorAll(".mchip")],rem=all.filter(c=>!c.classList.contains("onl")),sel=rem.filter(c=>c.classList.contains("sel")),ms=rem.filter(c=>c.classList.contains("no")),b=nd.querySelector(".addall");
    b.disabled=!sel.length&&!ms.length;
    b.textContent=sel.length?"Add selected ("+sel.length+")":ms.length?"Add all missing ("+ms.length+")":all.some(c=>c.classList.contains("no"))?"Missing items are on your list":"You have everything";
  });
}
document.addEventListener("click",e=>{
  let c=e.target.closest(".mchip");
  if(c){if(!c.classList.contains("onl")){c.classList.toggle("sel");syncCards();buzz(6)}return}
  let b=e.target.closest(".addall");
  if(b){let ch=[...b.closest(".need").querySelectorAll(".mchip:not(.onl)")],sel=ch.filter(x=>x.classList.contains("sel")),use=sel.length?sel:ch.filter(x=>x.classList.contains("no"));
    addToShop(use.map(x=>x.dataset.n),use);use.forEach(x=>x.classList.remove("sel"));syncCards()}
});
function renderShop(){
  let todo=shop.filter(s=>!s.done),dn=shop.filter(s=>s.done);
  const rw=s=>"<div class='srow"+(s.done?" dn":"")+"' data-id='"+s.id+"'><button class='chk press' data-chk aria-label='"+(s.done?"Mark not bought":"Mark bought")+"'><svg class='tick"+(s.done?" draw":"")+"' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg></button><span class='nm'>"+safe(s.name)+"</span><button class='x press' data-del aria-label='Remove "+safe(s.name)+"'><svg class='i'><use href='#x'/></svg></button></div>";
  let h="";
  if(!shop.length)h="<div class='empty'><div class='art'><svg class='i'><use href='#cart'/></svg></div><h2 class='serif'>Your list is empty</h2><p>Add missing ingredients from any recipe, or type something above.</p></div>";
  else{
    h=todo.length?"<div class='grp'>To buy</div><div class='list'>"+todo.map(rw).join("")+"</div>":"<div class='hero'><b>All done</b><span>Everything is in your basket.</span></div>";
    if(dn.length)h+="<div class='grp gh'><span>In the basket</span><button class='lnk press' data-clr>Clear</button></div><div class='list'>"+dn.map(rw).join("")+"</div>";
  }
  $("sl").innerHTML=h;
}
$("sl").addEventListener("click",e=>{
  if(e.target.closest("[data-clr]"))shop=shop.filter(s=>!s.done);
  else{
    let r=e.target.closest(".srow");if(!r)return;let i=shop.findIndex(s=>s.id===r.dataset.id);if(i<0)return;
    if(e.target.closest("[data-del]"))shop.splice(i,1);
    else if(e.target.closest("[data-chk]")){shop[i].done=!shop[i].done;buzz(10)}else return;
  }
  saveShop();renderShop();updBadge();syncCards();
});
function addShopInput(){let v=$("sin").value.split(",").map(x=>x.trim()).filter(Boolean);$("sin").value="";if(v.length)addToShop(v,v.map(()=>$("sadd")))}
$("sin").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addShopInput()}});
updBadge();

refresh();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
