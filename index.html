<!DOCTYPE html>
<html>
<head>
    <title>Pantry to Plate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e9e5b">
<style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; }
    li { padding: 10px; margin: 6px 0; border-radius: 6px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    .ok { background: #d4f4dd; }
    .soon { background: #fff3c4; }
    .expired { background: #ffd6d6; }
    .recipe { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 10px 0; }
    .recipe h3 { margin: 0 0 6px 0; }
    .tag { background: #fff3c4; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .missing { color: #a33; font-size: 14px; }
      input, button { font-size: 16px; padding: 8px; margin: 3px 0; }
    input { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
</style>
</head>
<body>
  <h1>My Pantry</h1>

  <input id="itemName" placeholder="Item (e.g. milk)">
  <input id="itemDate" type="date">
  <button onclick="addItem()">Add</button>

  <ul id="pantryList"></ul>

  <h1>What can I make?</h1>
  <div id="recipeList"></div>

  <script>
    // ---------- RECIPE DATA ----------
    // You can add your own recipes here later!
    const recipes = [
      { name: "Scrambled Eggs on Toast", ingredients: ["egg", "bread", "butter"] },
      { name: "Veggie Omelette", ingredients: ["egg", "cheese", "pepper", "onion"] },
      { name: "Grilled Cheese", ingredients: ["bread", "cheese", "butter"] },
      { name: "Pancakes", ingredients: ["flour", "milk", "egg", "butter"] },
      { name: "Chicken Fried Rice", ingredients: ["chicken", "rice", "egg", "onion"] },
      { name: "Pasta with Tomato Sauce", ingredients: ["pasta", "tomato", "garlic", "onion"] },
      { name: "Chicken Salad Sandwich", ingredients: ["chicken", "bread", "mayo", "celery"] },
      { name: "Banana Smoothie", ingredients: ["banana", "milk", "yogurt"] },
      { name: "Potato Soup", ingredients: ["potato", "onion", "milk", "butter"] },
      { name: "Bean Burritos", ingredients: ["beans", "tortilla", "cheese", "rice"] }
    ];

    // ---------- PANTRY DATA ----------
    let pantry = JSON.parse(localStorage.getItem("pantry")) || [];

    function savePantry() {
      localStorage.setItem("pantry", JSON.stringify(pantry));
    }

    function addItem() {
      let name = document.getElementById("itemName").value;
      let date = document.getElementById("itemDate").value;

      if (name === "" || date === "") {
        alert("Please enter an item and an expiry date.");
        return;
      }

      pantry.push({ name: name, expires: date });
      pantry.sort(function (a, b) {
        return a.expires.localeCompare(b.expires);
      });

      document.getElementById("itemName").value = "";
      savePantry();
      refresh();
    }

    function removeItem(index) {
      pantry.splice(index, 1);
      savePantry();
      refresh();
    }

    function daysLeft(dateString) {
      let today = new Date();
      today.setHours(0, 0, 0, 0);
      let expiry = new Date(dateString + "T00:00:00");
      return Math.round((expiry - today) / (1000 * 60 * 60 * 24));
    }

    // ---------- SHOW THE PANTRY ----------
    function showPantry() {
      let list = document.getElementById("pantryList");
      list.innerHTML = "";

      for (let i = 0; i < pantry.length; i++) {
        let item = pantry[i];
        let days = daysLeft(item.expires);
        let cssClass = "ok";
        let message = "expires in " + days + " days";

        if (days < 0) {
          cssClass = "expired";
          message = "EXPIRED";
        } else if (days === 0) {
          cssClass = "soon";
          message = "expires TODAY";
        } else if (days <= 3) {
          cssClass = "soon";
          message = "expires in " + days + " day(s), use it soon!";
        }

        list.innerHTML +=
          "<li class='" + cssClass + "'>" +
          "<span>" + item.name + " - " + message + "</span>" +
          "<button onclick='removeItem(" + i + ")'>Remove</button>" +
          "</li>";
      }
    }

    // ---------- RECIPE MATCHING ----------
    // Does a pantry item match a recipe ingredient? ("eggs" matches "egg")
    function itemMatches(itemName, ingredient) {
      let a = itemName.toLowerCase().trim();
      if (a.length < 3) return false;
      return a.includes(ingredient) || ingredient.includes(a);
    }

    function showRecipes() {
      let box = document.getElementById("recipeList");
      box.innerHTML = "";

      // Only items that aren't expired can be used
      let usable = pantry.filter(function (item) {
        return daysLeft(item.expires) >= 0;
      });

      let results = [];

      for (let recipe of recipes) {
        let have = [];
        let missing = [];
        let usesExpiring = 0;

        for (let ingredient of recipe.ingredients) {
          let found = usable.find(function (item) {
            return itemMatches(item.name, ingredient);
          });

          if (found) {
            have.push(ingredient);
            if (daysLeft(found.expires) <= 3) usesExpiring++;
          } else {
            missing.push(ingredient);
          }
        }

        if (have.length > 0) {
          results.push({
            name: recipe.name,
            have: have,
            missing: missing,
            usesExpiring: usesExpiring,
            percent: Math.round((have.length / recipe.ingredients.length) * 100)
          });
        }
      }

      // Best first: uses expiring food, then highest match
      results.sort(function (a, b) {
        if (b.usesExpiring !== a.usesExpiring) return b.usesExpiring - a.usesExpiring;
        return b.percent - a.percent;
      });

      if (results.length === 0) {
        box.innerHTML = "<p>Add some items to your pantry to see recipe ideas.</p>";
        return;
      }

      for (let r of results) {
        let html = "<div class='recipe'><h3>" + r.name + " (" + r.percent + "% match)</h3>";
        if (r.usesExpiring > 0) {
          html += "<span class='tag'>Uses food that's expiring soon</span><br>";
        }
        html += "<div>You have: " + r.have.join(", ") + "</div>";
        if (r.missing.length > 0) {
          html += "<div class='missing'>Missing: " + r.missing.join(", ") + "</div>";
        }
        html += "</div>";
        box.innerHTML += html;
      }
    }

    // ---------- REFRESH EVERYTHING ----------
    function refresh() {
      showPantry();
      showRecipes();
    }

       refresh();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
