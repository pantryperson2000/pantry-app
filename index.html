<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry to Plate</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2a21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a21;--leaf:#2f7d4f;--paper:#f3f6ee;--card:#fff;--line:#dde4d2;--tomato:#e5533d;--mustard:#e9b53a;--muted:#667266;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1;margin:0}
.top{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 56px}
.wrap{max-width:560px;margin:0 auto}
.top h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.top p{margin:8px 0 0;color:#c5d3c4;font-size:17px}
.top b{color:var(--mustard)}
main{max-width:560px;margin:-34px auto 0;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.scan{display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--leaf);color:#fff;border:0;width:100%;text-align:left;border-radius:var(--r);padding:18px}
.scan svg{flex:none;width:34px;height:34px}
.scan strong{display:block;font:800 20px "Bricolage Grotesque",sans-serif}
.scan span{font-size:14px;opacity:.9}
.scan.busy{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
#status{font-size:14px;color:var(--muted);margin:8px 4px 0;min-height:20px}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;font-size:22px;line-height:1}
details[open] summary::after{content:"\2212"}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.form input{grid-column:span 2;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.form input:first-child{grid-column:span 2}
.btn{font:700 16px "DM Sans",sans-serif;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer;grid-column:span 2}
h2{font-size:24px;margin:26px 4px 12px;font-weight:800}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:700;text-transform:capitalize}
.item .when{font-size:14px;color:var(--muted)}
.item .rm{grid-row:span 2;grid-column:2;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--leaf)}
.soon .bar i{background:var(--mustard)}.soon .when{color:#9a6f00;font-weight:700}
.gone .bar i{background:var(--tomato)}.gone .when{color:var(--tomato);font-weight:700}
.empty{color:var(--muted);padding:6px 0}
.recipe h3{font-size:20px;font-weight:800}
.recipe .meta{font-size:14px;color:var(--muted);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:99px;font-size:14px;background:var(--leaf);color:#fff;border:1px solid var(--leaf)}
.chip.no{background:none;color:var(--muted);border:1px dashed #aab5a6}
.flag{display:inline-block;background:var(--mustard);color:var(--ink);font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;margin-bottom:8px}
button:focus-visible,summary:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.scan.busy{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>Pantry to Plate</h1>
  <p id="summary">Add what you have and see what to cook.</p>
</div></header>

<main>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <button class="scan" id="scanBtn" onclick="document.getElementById('photoInput').click()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <div><strong>Scan a photo</strong><span>Snap your fridge or shelf and we'll list what's in it</span></div>
  </button>
  <div id="status" role="status"></div>

  <div class="card"><details>
    <summary>Add an item by hand</summary>
    <div class="form">
      <input id="itemName" placeholder="What is it? (e.g. milk)">
      <input id="itemDate" type="date" aria-label="Expiry date">
      <button class="btn" onclick="addItem()">Add to pantry</button>
    </div>
  </details></div>

  <h2>In your pantry</h2>
  <div class="card" id="pantryList"></div>

  <h2>What you can cook</h2>
  <div id="recipeList"></div>
</main>

<script>
const recipes=[
{name:"Scrambled eggs on toast",ingredients:["egg","bread","butter"]},
{name:"Veggie omelette",ingredients:["egg","cheese","pepper","onion"]},
{name:"Grilled cheese",ingredients:["bread","cheese","butter"]},
{name:"Pancakes",ingredients:["flour","milk","egg","butter"]},
{name:"Chicken fried rice",ingredients:["chicken","rice","egg","onion"]},
{name:"Pasta with tomato sauce",ingredients:["pasta","tomato","garlic","onion"]},
{name:"Chicken salad sandwich",ingredients:["chicken","bread","mayo","celery"]},
{name:"Banana smoothie",ingredients:["banana","milk","yogurt"]},
{name:"Potato soup",ingredients:["potato","onion","milk","butter"]},
{name:"Bean burritos",ingredients:["beans","tortilla","cheese","rice"]}
];
let pantry=JSON.parse(localStorage.getItem("pantry"))||[];
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem("pantry",JSON.stringify(pantry));
const sortP=()=>pantry.sort((a,b)=>a.expires.localeCompare(b.expires));
const safe=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function daysLeft(s){let t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+"T00:00:00")-t)/864e5)}
function dateIn(n){let d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function addItem(){
  let n=$("itemName").value.trim(),d=$("itemDate").value;
  if(!n||!d){alert("Enter what the item is and its expiry date.");return}
  pantry.push({name:n,expires:d});sortP();$("itemName").value="";save();refresh();
}
function removeItem(i){pantry.splice(i,1);save();refresh()}

function shrink(file){return new Promise((ok,bad)=>{
  let img=new Image();
  img.onload=()=>{let s=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7).split(",")[1])};
  img.onerror=()=>bad(new Error("That image couldn't be read. Try another photo."));
  img.src=URL.createObjectURL(file);
})}

$("photoInput").addEventListener("change",async()=>{
  let f=$("photoInput").files[0],st=$("status"),b=$("scanBtn");
  if(!f)return;
  st.textContent="Reading your photo. This takes a few seconds.";b.classList.add("busy");
  try{
    let r=await fetch("/.netlify/functions/scan",{method:"POST",body:JSON.stringify({image:await shrink(f),mimeType:"image/jpeg"})});
    let d=await r.json();
    if(!r.ok){st.textContent="Scan failed: "+(d.error||"unknown error")+". Try again in a minute.";return}
    let c=0;
    for(let it of d.items){if(it.name&&typeof it.days==="number"){pantry.push({name:it.name,expires:dateIn(Math.round(it.days))});c++}}
    sortP();save();refresh();
    st.textContent=c?("Added "+c+" items. Dates are estimates, so fix or remove any that look wrong."):"No food found in that photo. Try a closer shot.";
  }catch(e){st.textContent="Scan failed: "+e.message}
  finally{b.classList.remove("busy");$("photoInput").value=""}
});

function showPantry(){
  let box=$("pantryList");
  if(!pantry.length){box.innerHTML="<div class='empty'>Nothing here yet. Scan a photo or add an item to start.</div>";return}
  box.innerHTML=pantry.map((it,i)=>{
    let d=daysLeft(it.expires),cls="",msg="Good for "+d+" days";
    if(d<0){cls="gone";msg="Expired"}
    else if(d===0){cls="soon";msg="Use today"}
    else if(d<=3){cls="soon";msg="Use within "+d+(d===1?" day":" days")}
    let w=d<0?100:Math.max(6,Math.min(100,d/14*100));
    return "<div class='item "+cls+"'><div class='name'>"+safe(it.name)+"</div><button class='rm' onclick='removeItem("+i+")' aria-label='Remove "+safe(it.name)+"'>Remove</button><div class='when'>"+msg+"</div><div class='bar'><i style='width:"+w+"%'></i></div></div>";
  }).join("");
}

function match(n,g){let a=n.toLowerCase().trim();return a.length>=3&&(a.includes(g)||g.includes(a))}

function showRecipes(){
  let box=$("recipeList"),usable=pantry.filter(i=>daysLeft(i.expires)>=0),res=[];
  for(let r of recipes){
    let have=[],miss=[],ex=0;
    for(let g of r.ingredients){
      let f=usable.find(i=>match(i.name,g));
      if(f){have.push(g);if(daysLeft(f.expires)<=3)ex++}else miss.push(g);
    }
    if(have.length)res.push({name:r.name,have,miss,ex,p:have.length/r.ingredients.length,total:r.ingredients.length});
  }
  res.sort((a,b)=>b.ex-a.ex||b.p-a.p);
  if(!res.length){box.innerHTML="<div class='card empty'>Add a few ingredients and recipes will show up here.</div>";return}
  box.innerHTML=res.map(r=>
    "<div class='card recipe'>"+(r.ex?"<div class='flag'>Uses food that expires soon</div>":"")+
    "<h3>"+r.name+"</h3><div class='meta'>You have "+r.have.length+" of "+r.total+" ingredients</div><div class='chips'>"+
    r.have.map(g=>"<span class='chip'>"+g+"</span>").join("")+r.miss.map(g=>"<span class='chip no'>"+g+"</span>").join("")+"</div></div>"
  ).join("");
}

function showSummary(){
  let n=pantry.filter(i=>{let d=daysLeft(i.expires);return d>=0&&d<=3}).length,x=pantry.filter(i=>daysLeft(i.expires)<0).length,s=$("summary");
  if(!pantry.length)s.textContent="Add what you have and see what to cook.";
  else if(n)s.innerHTML="<b>"+n+(n===1?" item needs":" items need")+" eating</b> in the next 3 days."+(x?" "+x+" expired.":"");
  else if(x)s.textContent=x+(x===1?" item has":" items have")+" expired. Time to clear them out.";
  else s.textContent="Everything is fresh. Nothing to rush.";
}

function refresh(){showPantry();showRecipes();showSummary()}
refresh();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
